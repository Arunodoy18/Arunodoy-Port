[build]
  command = "npm run build"
  publish = "dist"

# One official address: send the old Netlify subdomain to c3studio.buildc3.tech (avoids duplicate content).
[[redirects]]
  from = "https://arunodoy-os.netlify.app/*"
  to = "https://c3studio.buildc3.tech/:splat"
  status = 301
  force = true

# Fingerprinted JS/CSS and fonts never change: cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Screenshots and photos: cache for a week.
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/team/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
