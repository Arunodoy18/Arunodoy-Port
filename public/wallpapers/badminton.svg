<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a78"/>
      <stop offset="0.35" stop-color="#3b5bdb"/>
      <stop offset="0.62" stop-color="#f08aa6"/>
      <stop offset="0.8" stop-color="#ffb26b"/>
      <stop offset="1" stop-color="#ffd59a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.68" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffd08a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffb26b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fde2ec"/>
      <stop offset="1" stop-color="#f6a6bd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6b5a"/>
      <stop offset="1" stop-color="#0b2b2a"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#0d1024"/>
    </linearGradient>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 0L14 14M14 0L0 14" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <!-- Stars in the upper sky -->
  <g fill="#ffffff">
    <circle cx="240" cy="70" r="1.6" opacity="0.8"/><circle cx="520" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="860" cy="60" r="1.8" opacity="0.7"/><circle cx="1120" cy="110" r="1.2" opacity="0.5"/>
    <circle cx="1500" cy="50" r="1.6" opacity="0.8"/><circle cx="1760" cy="140" r="1.3" opacity="0.6"/>
    <circle cx="680" cy="200" r="1" opacity="0.5"/><circle cx="1680" cy="240" r="1" opacity="0.5"/>
  </g>

  <!-- Anime cumulus clouds -->
  <g filter="url(#soft)" fill="url(#cloud)">
    <g opacity="0.95">
      <circle cx="260" cy="560" r="120"/><circle cx="400" cy="500" r="150"/><circle cx="560" cy="560" r="120"/>
      <circle cx="680" cy="610" r="90"/><circle cx="140" cy="630" r="90"/><rect x="120" y="580" width="620" height="120" rx="60"/>
    </g>
    <g opacity="0.85">
      <circle cx="1600" cy="420" r="90"/><circle cx="1720" cy="380" r="120"/><circle cx="1850" cy="430" r="95"/>
      <rect x="1520" y="420" width="420" height="90" rx="45"/>
    </g>
    <g opacity="0.6">
      <circle cx="980" cy="300" r="50"/><circle cx="1050" cy="280" r="64"/><circle cx="1120" cy="305" r="46"/>
      <rect x="940" y="300" width="220" height="44" rx="22"/>
    </g>
  </g>

  <!-- Distant skyline -->
  <path d="M0 790 L0 740 L70 740 L70 700 L130 700 L130 760 L210 760 L210 680 L260 680 L260 730 L340 730 L340 770 L430 770 L430 710 L470 710 L470 690 L520 690 L520 760 L640 760 L640 730 L720 730 L720 780 L1920 780 L1920 790 Z" fill="#7b3f73" opacity="0.55"/>
  <path d="M1500 790 L1500 720 L1560 720 L1560 690 L1610 690 L1610 740 L1700 740 L1700 700 L1760 700 L1760 760 L1840 760 L1840 730 L1920 730 L1920 790 Z" fill="#7b3f73" opacity="0.5"/>

  <!-- Court floor -->
  <rect y="780" width="1920" height="300" fill="url(#floor)"/>
  <g stroke="#e8fff6" stroke-opacity="0.7" stroke-width="5" fill="none">
    <path d="M-200 1080 L520 790 L1400 790 L2120 1080"/>
    <path d="M60 1080 L640 820 L1280 820 L1860 1080" stroke-opacity="0.45"/>
    <path d="M960 790 L960 1080" stroke-opacity="0.45"/>
    <path d="M330 900 L1590 900" stroke-opacity="0.45"/>
  </g>

  <!-- Net -->
  <g>
    <rect x="300" y="690" width="760" height="70" fill="url(#mesh)"/>
    <rect x="300" y="684" width="760" height="9" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="292" y="684" width="10" height="150" fill="#e2e8f0"/>
    <rect x="1056" y="684" width="10" height="150" fill="#e2e8f0"/>
  </g>

  <!-- Player shadow -->
  <ellipse cx="1300" cy="985" rx="150" ry="20" fill="#000" opacity="0.35"/>

  <!-- Anime speed lines -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.35">
    <path d="M1520 180 L1700 90" stroke-width="3"/><path d="M1540 300 L1760 260" stroke-width="2"/>
    <path d="M1500 480 L1720 540" stroke-width="3"/><path d="M1460 640 L1640 760" stroke-width="2"/>
    <path d="M1180 100 L1120 20" stroke-width="2"/><path d="M1420 80 L1480 0" stroke-width="3"/>
  </g>

  <!-- Smash trail and shuttlecock -->
  <path d="M1330 150 Q1180 170 1010 300" stroke="#fff6d8" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5" filter="url(#glow)"/>
  <path d="M1330 150 Q1180 170 1010 300" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <g transform="translate(990 315) rotate(-38)" filter="url(#glow)">
    <path d="M0 0 L46 -18 L46 18 Z" fill="#ffffff"/>
    <path d="M14 -5 L46 -18 M14 5 L46 18 M14 0 L46 0" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="9" fill="#f97316"/>
  </g>

  <!-- Player: drawn twice, a warm rim-light copy offset behind the dark figure -->
  <defs>
    <g id="player" stroke-linecap="round" stroke-linejoin="round">
      <!-- legs -->
      <path d="M1282 548 L1228 640 L1250 735 L1222 745" stroke-width="42" fill="none"/>
      <path d="M1300 548 L1355 625 L1420 605 L1440 622" stroke-width="42" fill="none"/>
      <!-- shorts -->
      <path d="M1250 520 L1330 520 L1345 590 L1300 575 L1285 600 L1240 585 Z"/>
      <!-- torso (shirt) -->
      <path d="M1262 395 Q1295 380 1330 400 L1338 470 Q1330 530 1330 530 L1252 530 Q1248 470 1262 395 Z"/>
      <!-- shirt flap in the wind -->
      <path d="M1330 470 Q1372 490 1392 520 Q1360 525 1334 515 Z"/>
      <!-- racket arm, raised back -->
      <path d="M1322 412 L1386 332 L1362 245" stroke-width="32" fill="none"/>
      <!-- free arm, reaching forward -->
      <path d="M1268 415 L1205 372 L1152 318" stroke-width="30" fill="none"/>
      <!-- neck and head -->
      <path d="M1294 395 L1298 360" stroke-width="22" fill="none"/>
      <circle cx="1303" cy="330" r="38"/>
      <!-- spiky anime hair, swept back by the jump -->
      <path d="M1268 318 L1252 286 L1284 298 L1280 262 L1308 290 L1322 255 L1332 292 L1370 270 L1348 306 L1388 310 L1346 326 L1376 348 L1336 344 L1318 304 Z"/>
      <!-- racket -->
      <path d="M1362 245 L1348 196" stroke-width="9" fill="none"/>
      <ellipse cx="1330" cy="140" rx="36" ry="54" transform="rotate(-18 1330 140)" fill="none" stroke-width="8"/>
    </g>
  </defs>
  <use href="#player" transform="translate(5 -4)" fill="#ffd58a" stroke="#ffd58a" opacity="0.95"/>
  <use href="#player" fill="url(#figure)" stroke="#121530"/>
  <!-- racket strings -->
  <g transform="rotate(-18 1330 140)" stroke="#e2e8f0" stroke-width="1.4" opacity="0.7">
    <path d="M1310 98 L1310 182 M1322 88 L1322 192 M1334 87 L1334 193 M1346 92 L1346 188"/>
    <path d="M1298 116 L1362 116 M1296 130 L1364 130 M1296 144 L1364 144 M1297 158 L1363 158 M1300 172 L1360 172"/>
  </g>
</svg>
